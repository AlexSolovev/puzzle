<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <!-- Playful Quiz Confetti & Shapes -->
  <circle cx="80" cy="45" r="6" fill="#FF595E" />
  <circle cx="520" cy="50" r="7" fill="#1982C4" />
  <circle cx="140" cy="180" r="5" fill="#8AC926" />
  <circle cx="470" cy="175" r="6" fill="#FFCA3A" />
  <rect x="110" y="30" width="12" height="6" rx="2" fill="#6A4C93" transform="rotate(25 110 30)" />
  <rect x="480" y="35" width="12" height="6" rx="2" fill="#FF595E" transform="rotate(-30 480 35)" />

  <!-- Floating Question Marks -->
  <text x="65" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#6A4C93" transform="rotate(-15 65 135)">?</text>
  <text x="530" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#1982C4" transform="rotate(15 530 130)">?</text>

  <!-- Quiz Idea Lightbulb Icon -->
  <g transform="translate(275, 16)">
    <!-- Rays -->
    <line x1="25" y1="2" x2="25" y2="7" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="9" x2="12" y2="13" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" />
    <line x1="42" y1="9" x2="38" y2="13" stroke="#FFB703" stroke-width="2.5" stroke-linecap="round" />
    <!-- Bulb -->
    <path d="M15,26 C15,17 20,12 25,12 C30,12 35,17 35,26 C35,31 31,34 30,39 H20 C19,34 15,31 15,26 Z" fill="#FFCA3A" />
    <!-- Base -->
    <rect x="20" y="41" width="10" height="3" rx="1.5" fill="#023047" />
    <rect x="21.5" y="45" width="7" height="3" rx="1.5" fill="#023047" />
  </g>

  <!-- Main Welcome Text -->
  <text x="300" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#1D3557" text-anchor="middle" letter-spacing="1">
    WELCOME TO THE QUIZ!
  </text>
</svg>
