<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <!-- Party Confetti & Streamers -->
  <circle cx="80" cy="45" r="6" fill="#FF595E" />
  <circle cx="520" cy="50" r="7" fill="#1982C4" />
  <circle cx="140" cy="180" r="5" fill="#8AC926" />
  <circle cx="470" cy="175" r="6" fill="#FFCA3A" />
  <rect x="110" y="30" width="12" height="6" rx="2" fill="#6A4C93" transform="rotate(25 110 30)" />
  <rect x="480" y="35" width="12" height="6" rx="2" fill="#FF595E" transform="rotate(-30 480 35)" />
  <polygon points="65,130 75,120 80,135" fill="#FFCA3A" />
  <polygon points="535,125 545,115 550,130" fill="#8AC926" />

  <!-- Success Trophy Icon -->
  <g transform="translate(275, 20)">
    <path d="M10,10 H40 V30 C40,42 10,42 10,30 Z" fill="#FFB703" />
    <path d="M10,15 H3 C1,15 1,28 10,28" fill="none" stroke="#FFB703" stroke-width="3" />
    <path d="M40,15 H47 C49,15 49,28 40,28" fill="none" stroke="#FFB703" stroke-width="3" />
    <rect x="22" y="38" width="6" height="12" fill="#FB8500" />
    <rect x="15" y="50" width="20" height="5" rx="2" fill="#023047" />
  </g>

  <!-- Main Congratulations Text -->
  <text x="300" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#1D3557" text-anchor="middle" letter-spacing="1">
    CONGRATULATIONS!
  </text>

  <!-- Success & Party Subtitle -->
  <text x="300" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#E63946" text-anchor="middle" letter-spacing="3">
    CELEBRATING YOUR SUCCESS
  </text>
</svg>
